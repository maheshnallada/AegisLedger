name: AegisLedger CI (Continuous Integration)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. BACKEND TEST SUITE & CONCURRENCY VERIFICATION
  # ============================================================================
  backend-test:
    name: Backend Tests (Python 3.12 & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite (Unit, Concurrency & Deadlock Tests)
        env:
          DATABASE_URL: sqlite:///./test_ci.db
        run: |
          pytest backend/tests/ -v --durations=10

  # ============================================================================
  # 2. FRONTEND PRODUCTION BUILD VALIDATION
  # ============================================================================
  frontend-build:
    name: Frontend Build (Node.js 20 & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Verify Dist Artifact Exists
        run: |
          test -f frontend/dist/index.html || { echo "Frontend build failed: dist/index.html not found"; exit 1; }

  # ============================================================================
  # 3. DOCKER CONTAINER INTEGRITY CHECK
  # ============================================================================
  docker-smoke-test:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegis-ledger-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aegis-ledger-frontend:ci-test
