name: AegisLedger CD (Deploy to AWS & Supabase)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'Skip Supabase database migration step'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI VALIDATION (Pre-flight checks before touching production)
  # ============================================================================
  pre-flight-checks:
    name: Run Pre-Flight CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run Backend Tests
        run: |
          pip install -r backend/requirements.txt
          pytest backend/tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ============================================================================
  # 2. SUPABASE DATABASE SCHEMA MIGRATION
  # ============================================================================
  database-migration:
    name: Sync Supabase Database Schema
    runs-on: ubuntu-latest
    needs: [pre-flight-checks]
    if: ${{ github.event.inputs.skip_migration != 'true' && secrets.DATABASE_URL != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install DB Migration Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Execute Migration on Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backend/init_db.py

  # ============================================================================
  # 3. BACKEND CONTAINER BUILD & DEPLOY TO AWS (ECR + APP RUNNER)
  # ============================================================================
  deploy-backend:
    name: Build & Deploy Backend (ECR & App Runner)
    runs-on: ubuntu-latest
    needs: [pre-flight-checks]
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'aegis-ledger-backend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger AWS App Runner Deployment
        if: ${{ secrets.AWS_APP_RUNNER_ARN != '' }}
        run: |
          echo "Triggering deployment for App Runner Service ARN: ${{ secrets.AWS_APP_RUNNER_ARN }}"
          aws apprunner start-deployment --service-arn ${{ secrets.AWS_APP_RUNNER_ARN }}

  # ============================================================================
  # 4. FRONTEND BUILD & DEPLOY TO AWS (S3 + CLOUDFRONT)
  # ============================================================================
  deploy-frontend:
    name: Build & Deploy Frontend (S3 & CloudFront)
    runs-on: ubuntu-latest
    needs: [pre-flight-checks]
    if: ${{ secrets.AWS_S3_BUCKET != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite Production Bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync Static Files to Amazon S3
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.AWS_S3_BUCKET }} --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
