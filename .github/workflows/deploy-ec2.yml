name: AegisLedger CD (Deploy to AWS EC2 Free Tier)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ec2-production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI VALIDATION (Pre-flight checks)
  # ============================================================================
  ci-test:
    name: Run Pytest & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run Backend Tests
        run: |
          pip install -r backend/requirements.txt
          pytest backend/tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ============================================================================
  # 2. DEPLOY TO AWS EC2 VIA SSH & DOCKER COMPOSE
  # ============================================================================
  deploy-to-ec2:
    name: Deploy to EC2 (Docker Compose)
    runs-on: ubuntu-latest
    needs: [ci-test]
    steps:
      - name: Deploy to EC2 instance via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "[*] Connected to EC2 instance: $(hostname)"
            
            # Ensure repository exists (supports either AegisLedger or TransactionLedger directory)
            REPO_DIR="AegisLedger"
            if [ -d "TransactionLedger" ]; then
              REPO_DIR="TransactionLedger"
            elif [ ! -d "AegisLedger" ]; then
              echo "[*] Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git AegisLedger
              REPO_DIR="AegisLedger"
            fi
            
            cd "$REPO_DIR"
            echo "[*] Working directory: $(pwd)"
            echo "[*] Pulling latest changes from main..."
            git fetch --all
            git reset --hard origin/main
            
            # Update .env file with Supabase credentials
            echo "[*] Configuring environment..."
            cat << 'EOF' > .env
            APP_NAME=AegisLedger
            APP_VERSION=1.0.0
            DEBUG=False
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EOF
            
            # Detect docker compose command (supports both plugin and standalone)
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Installing docker-compose-plugin..."
              sudo apt update && sudo apt install -y docker-compose-plugin || sudo apt install -y docker-compose
              COMPOSE_CMD="docker compose"
            fi
            
            echo "[*] Using compose command: $COMPOSE_CMD"
            
            # Rebuild and restart containers
            echo "[*] Launching containers via Docker Compose..."
            $COMPOSE_CMD down
            $COMPOSE_CMD up -d --build
            
            # Wait for health check with retries (up to 30s for database pool handshake)
            echo "[*] Waiting for backend to become healthy..."
            HEALTHY=false
            for i in $(seq 1 15); do
              echo "Health check probe $i of 15..."
              if curl -s -f http://localhost:8000/health >/dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              sleep 2
            done

            $COMPOSE_CMD ps

            if [ "$HEALTHY" = "true" ]; then
              echo "[+] Health check passed: API is responding on http://localhost:8000/health"
              curl -s http://localhost:8000/health
              echo ""
              echo "[+] Deployment to EC2 completed successfully!"
            else
              echo "[-] Backend health check failed after 30 seconds."
              echo "[*] Container logs:"
              $COMPOSE_CMD logs --tail=50 backend
              exit 1
            fi

