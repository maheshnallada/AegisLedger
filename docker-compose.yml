version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_ledger_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AegisLedger
      - APP_VERSION=1.0.0
      - DEBUG=False
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/aegis_ledger.db}
    volumes:
      - ledger_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis_ledger_ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ledger_data:
